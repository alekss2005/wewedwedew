    </div>`,
    iconSize: [SIZE_BASE, SIZE_BASE],
    iconAnchor: [SIZE_BASE/2, SIZE_BASE/2],
    popupAnchor: [0, -SIZE_BASE/2]
  });
}
function guessIcon(cls, hdg, alt, falling, stage, confirmN, totalWeight, eta, stale) {
  const meta = getMeta(cls.type);
  const isUav = !!meta.isUav && !cls.isMissile && !cls.isBanderol && !cls.isJetDrone && !cls.isMig && !cls.isStrategic && !cls.isAwacs;
  const svg = isUav ? uavSvg() : meta.icon(meta.color);
  let rot = hdg != null ? hdg : 0;
  if (meta.isKAB) rot = (hdg || 0) - 90;
  else if (isUav || meta.isMig || meta.isStrategic || meta.isAwacs) rot = hdg != null ? hdg : 0;

  const iconClasses = ["threat-icon"];
  if (falling) iconClasses.push("falling");
  if (meta.isStrategic) iconClasses.push("strat-pulse");
  const isObservation = OBSERVATION_TYPES.has(cls.type);
  if (isObservation) iconClasses.push("observation");
  if (stale) iconClasses.push("stale");

  const arrow = (hdg != null && !falling && !cls.isMig && !cls.isStrategic) ? `<div class="dir-arrow"></div>` : "";

  const altHtml = alt != null
    ? `<div class="alt-badge${alt <= 300 ? " low" : ""}">${formatAlt(alt)}</div>` : "";
  const etaHtml = (eta != null && eta > 0 && eta < 600 && !isObservation)
    ? `<div class="eta-badge">${formatEta(eta)}</div>` : "";
  const fallingHtml = falling ? `<div class="falling-badge">↓ ПАДАЄ</div>` : "";
  const staleHtml = stale ? `<div class="stale-badge">⌛ ДАНІ СТАРІ</div>` : "";
  let confirmHtml = "";
  if (confirmN >= CONFIG.MIN_CHANNELS_CONFIRM) {
    confirmHtml = `<div class="confirm-badge ${confirmBadgeClass(confirmN, totalWeight||0)}">${confirmN}</div>`;
  } else if (confirmN === 1 && stage === "threat") {
    confirmHtml = `<div class="confirm-badge pending">⏱</div>`;
  }

  const badgeColor = cls.isStrategic ? "#9a3412" :
                     cls.isMissile ? "#7f1d1d" :
                     cls.isMig ? "#7c2d12" :
                     cls.isAwacs ? "#0369a1" : "#1e293b";
  const badgeBorder = cls.isStrategic ? "#ea580c" :
                      cls.isMissile ? "#dc2626" :
                      cls.isMig ? "#ea580c" :
                      cls.isAwacs ? "#0ea5e9" : "#94a3b8";

  const stageHtml = isObservation
    ? `<div class="stage-badge observe" style="top:100%;bottom:auto;margin-top:16px">👁 СПОСТЕРЕЖЕННЯ</div>`
    : (stage === "threat" ? `<div class="stage-badge warn" style="top:100%;bottom:auto;margin-top:16px">⚠ ЗАГРОЗА</div>` : "")
    + (stage === "launch" ? `<div class="stage-badge" style="top:100%;bottom:auto;margin-top:16px">🚀 ПУСК</div>` : "")
    + (stage === "takeoff" ? `<div class="stage-badge takeoff" style="top:100%;bottom:auto;margin-top:16px">✈ ВЗЛЁТ</div>` : "")
    + (stage === "ready" ? `<div class="stage-badge ready" style="top:100%;bottom:auto;margin-top:16px">⚠ ГОТОВНІСТЬ</div>` : "");

  return L.divIcon({
    className:"",
    html:`<div style="position:relative;width:${SIZE_BASE}px;height:${SIZE_BASE}px">
      <div class="${iconClasses.join(" ")}" style="position:absolute;inset:0;transform:rotate(${rot}deg)">
        ${arrow}${svg}
      </div>
      <div style="position:absolute;left:50%;top:100%;margin-top:2px;transform:translateX(-50%);
        background:${badgeColor};color:#fff;font-size:8px;font-weight:800;
        padding:1px 4px;border-radius:3px;border:1px solid ${badgeBorder};white-space:nowrap">${cls.label}</div>
      ${confirmHtml}${altHtml}${etaHtml}${fallingHtml}${staleHtml}
      ${stageHtml}
    </div>`,
    iconSize: [SIZE_BASE, SIZE_BASE],
    iconAnchor: [SIZE_BASE/2, SIZE_BASE/2],
    popupAnchor: [0, -SIZE_BASE/2]
  });
}

function totalWeightOf(channelsSet) {
  let w = 0;
  for (const ch of channelsSet) w += channelWeight(ch);
  return w;
}

function syncMessageThreats(messages) {
  const now = Date.now();
  const candidates = new Map();
  const impacts = new Map();

  for (let i = 0; i < (messages||[]).length; i++) {
    const m = messages[i];
    const text = m.text || "";
    const ch = (m.channel || "unknown").replace(/^@/, "").toLowerCase();
    const msgMs = m.date ? Date.parse(m.date) : now;

    const launches = extractLaunchStage(text);
    if (launches.length > 0) {
      for (const L of launches) {
        const key = `reg|${L.key}|${L.cls.type}|${L.stage || "obs"}`;
        if (!candidates.has(key)) {
          candidates.set(key, {
            kind: L.kind, origin: L, cls: L.cls, stage: L.stage,
            region: { key: L.key, name: L.name, lat: L.lat, lon: L.lon },
            target: L.target, count: L.count || null,
            channels: new Set(),
            firstSeen: msgMs, lastSeen: msgMs, sampleText: text
          });
        }
        const c = candidates.get(key);
        c.channels.add(ch);
        if (msgMs < c.firstSeen) c.firstSeen = msgMs;
        if (msgMs > c.lastSeen) c.lastSeen = msgMs;
        if (text.length < c.sampleText.length) c.sampleText = text;
        if (L.count && (!c.count || L.count > c.count)) c.count = L.count;
      }
      continue;
    }

    const extracted = extractPlaceAndType(text);
    if (extracted) {
      const { place, cls, directionTarget } = extracted;
      const key = `msg|${place.key}|${cls.type}`;
      if (!candidates.has(key)) {
        candidates.set(key, {
          kind: "place", place, cls, target: directionTarget,
          channels: new Set(),
          firstSeen: msgMs, lastSeen: msgMs, sampleText: text
        });
      }
      const c = candidates.get(key);
      c.channels.add(ch);
      if (msgMs < c.firstSeen) c.firstSeen = msgMs;
      if (msgMs > c.lastSeen) c.lastSeen = msgMs;
      if (text.length < c.sampleText.length) c.sampleText = text;
      continue;
    }

    const impact = extractImpact(text);
    if (impact) {
      const key = `imp|${impact.target.key}`;
      if (!impacts.has(key)) {
        impacts.set(key, {
          target: impact.target,
          channels: new Set(),
          eventAt: null, lastSeen: msgMs, sampleText: text
        });
      }
      const c = impacts.get(key);
      c.channels.add(ch);
      const evt = parseEventTime(text, m.date);
      if (evt && (!c.eventAt || evt > c.eventAt)) c.eventAt = evt;
      if (msgMs < c.lastSeen) c.lastSeen = msgMs;
      if (text.length < c.sampleText.length) c.sampleText = text;
    }
  }

  const seen = new Set();

  for (const [key, c] of candidates) {
    const confirmN = c.channels.size;
    const totalW = totalWeightOf(c.channels);
    const isThreatSolo = c.stage === "threat" && confirmN < CONFIG.MIN_CHANNELS_CONFIRM;
    const isMig = c.cls && c.cls.isMig;
    const isStrategic = c.cls && c.cls.isStrategic;
    const isAwacs = c.cls && c.cls.isAwacs;
    const isObservation = c.cls && OBSERVATION_TYPES.has(c.cls.type);
    const age = now - c.firstSeen;

    if (isStrategic) {
      if (confirmN < 1) continue;
      if (age > CONFIG.STRAT_READY_TTL_MS) continue;
    } else if (isMig) {
      if (confirmN < 1) continue;
      if (age > CONFIG.STALE_MSG_MS) continue;
    } else if (isAwacs) {
      continue;
    } else if (isObservation) {
      if (confirmN < CONFIG.MIN_CHANNELS_CONFIRM) continue;
      if (age > CONFIG.STALE_MSG_MS) continue;
    } else if (isThreatSolo) {
      if (age > CONFIG.LAUNCHER_SOLO_TTL_MS) continue;
    } else if (confirmN < CONFIG.MIN_CHANNELS_CONFIRM) {
      continue;
    } else if (totalW < 2.0) {
      continue;
    }
    seen.add(key);

    if (c.kind === "strategic") {
      const { region, cls, origin, count } = c;
      if (!stratActive.has(key)) {
        stratActive.set(key, {
          count: count || 1,
          firstSeen: c.firstSeen, lastSeen: c.lastSeen,
          bases: new Set(), channels: new Set()
        });
      }
      const active = stratActive.get(key);
      active.lastSeen = c.lastSeen;
      if (count) active.count = count;
      if (origin && origin.name) active.bases.add(origin.name);
      c.channels.forEach(ch => active.channels.add(ch));

      if (region.lat != null && region.lon != null) {
        const zoneOk = inZone(region.lat, region.lon) || CONFIG.STRAT_SHOW_OUTSIDE_ZONE;
        if (!zoneOk) continue;
        const fakeThreat = {
          type: cls.type, _altitude: null, _falling: false,
          _stage: "ready", _count: count || null, heading: null
        };
        const marker = L.marker([region.lat, region.lon], {
          icon: makeIcon(fakeThreat, null, false, confirmN, totalW, null, false),
          zIndexOffset: 930
        });
        const zoneNote = !inZone(region.lat, region.lon)
          ? '<br><span style="color:#94a3b8">поза зоною Києва</span>' : "";
        marker.bindPopup(
          `<div class="popup-title type-strategic_aviation">⚠ Стратегічна авіація · готовність</div>
           <div>${esc(c.sampleText.slice(0,220))}</div>
           <div class="popup-meta">
             <b>${esc(origin.name)}</b> (${esc(origin.region)})${zoneNote}
             ${count ? `<br>Бортов: <b>${count}</b>` : ""}
             <br>Стадия: ГОТОВНІСТЬ, без пуска
             <br>Подтверждений: <b>${confirmN}</b> канал(ов), вес <b>${totalW.toFixed(1)}</b>
           </div>
           ${channelsListHtml(c.channels)}
           <div class="popup-guess">⚠️ Позиція = аэродром базирования. Ту-95МС/Ту-160 — носители Х-101/Х-555.</div>`
        );
        marker.addTo(msgThreatLayer);
        if (msgMarkers.has(key)) {
          const _old = msgMarkers.get(key);
          if (_old.marker) msgThreatLayer.removeLayer(_old.marker);
          detachTrail(_old);
        }
        msgMarkers.set(key, {
          marker, lastSeen: c.lastSeen, firstSeen: c.firstSeen,
          alt: null, falling: false, hdg: null,
          cls, place: { name: origin.name, lat: region.lat, lon: region.lon },
          targetPlace: null,
          threat: { type: cls.type, status: "active" },
          isRegion: true, stage: "ready", confirmN, totalWeight: totalW, channels: c.channels,
          stale: false, trail: null
        });
      }
      continue;
    }

    if (c.kind === "mig") {
      const { region, cls, origin } = c;
      if (region.lat == null || region.lon == null) {
        if (!msgMarkers.has(key)) {
          msgMarkers.set(key, {
            marker: null, lastSeen: c.lastSeen, firstSeen: c.firstSeen,
            alt: null, falling: false, hdg: null,
            cls, place: { name: "аэродром не указан", lat: null, lon: null },
            targetPlace: null,
            threat: { type: cls.type, status: "active" },
            isRegion: true, stage: "takeoff", confirmN, totalWeight: totalW, channels: c.channels,
            stale: false, trail: null, noCoord: true
          });
        } else {
          const o = msgMarkers.get(key);
          o.lastSeen = c.lastSeen; o.confirmN = confirmN;
          c.channels.forEach(ch => o.channels.add(ch));
        }
        continue;
      }
      const zoneOk = inZone(region.lat, region.lon) || CONFIG.MIG_SHOW_OUTSIDE_ZONE;
      if (!zoneOk) continue;
      const marker = L.marker([region.lat, region.lon], {
        icon: guessIcon(cls, null, null, false, "takeoff", confirmN, totalW, null, false),
        zIndexOffset: 935
      });
      const zoneNote = !inZone(region.lat, region.lon)
        ? '<br><span style="color:#94a3b8">поза зоною Києва</span>' : "";
      marker.bindPopup(
        `<div class="popup-title type-mig31k">✈ МиГ-31К · взлёт</div>
         <div>${esc(c.sampleText.slice(0,220))}</div>
         <div class="popup-meta">
           <b>${esc(origin.name)}</b> (${esc(origin.region)})${zoneNote}
           <br>Стадия: ВЗЛЁТ, без пуска
           <br>Подтверждений: <b>${confirmN}</b> канал(ов), вес <b>${totalW.toFixed(1)}</b>
         </div>
         ${channelsListHtml(c.channels)}
         <div class="popup-guess">⚠️ Позиція = аэродром взлёта. МиГ-31К — носитель Кинжалов.</div>`
      );
      marker.addTo(msgThreatLayer);
      if (msgMarkers.has(key)) {
        const _old = msgMarkers.get(key);
        if (_old.marker) msgThreatLayer.removeLayer(_old.marker);
        detachTrail(_old);
      }
      msgMarkers.set(key, {
        marker, lastSeen: c.lastSeen, firstSeen: c.firstSeen,
        alt: null, falling: false, hdg: null,
        cls, place: { name: origin.name, lat: region.lat, lon: region.lon },
        targetPlace: null,
        threat: { type: cls.type, status: "active" },
        isRegion: true, stage: "takeoff", confirmN, totalWeight: totalW, channels: c.channels,
        stale: false, trail: null
      });
      continue;
    }

    if (c.kind === "observation") {
      const { cls, target } = c;
      const place = target;
      const src = DEFAULT_SOURCES[cls.type];
      let markerBearing;
      if (src) markerBearing = bearingBetween(place.lat, place.lon, src.lat, src.lon);
      else markerBearing = 0;
      let arrowBearing = (markerBearing + 180) % 360;

      if (needsTrail(cls.type)) {
        const { origin, dist } = nearestRussianOrigin(place.lat, place.lon);
        if (origin && dist >= CONFIG.TRAIL_MIN_ORIGIN_DIST_KM) {
          arrowBearing = bearingBetween(origin.lat, origin.lon, place.lat, place.lon);
        }
      }
      const displayPos = destPoint(place.lat, place.lon, (arrowBearing + 180) % 360, CONFIG.BANDEROL_OFFSET_KM);

      const marker = L.marker(displayPos, {
        icon: guessIcon(cls, arrowBearing, null, false, null, confirmN, totalW, null, false),
        zIndexOffset: 900
      });
      const srcNote = src
        ? `Источник (оценка): ${esc(src.name)} · азимут ${Math.round(arrowBearing)}°`
        : `Направление полёта: не определено`;
      marker.bindPopup(
        `<div class="popup-title type-${cls.type}">${cls.label} ?</div>
         <div>${esc(c.sampleText.slice(0,220))}</div>
         <div class="popup-meta">
           Місце повідомлення: <b>${esc(place.name)}</b>
           <br>${srcNote}
           <br>Подтверждений: <b>${confirmN}</b> канал(ов), вес <b>${totalW.toFixed(1)}</b>
         </div>
         ${channelsListHtml(c.channels)}
         <div class="popup-guess">👁 Факт наблюдения. Маркер условно в ${CONFIG.BANDEROL_OFFSET_KM} км от точки наблюдения по направлению к источнику пуска.</div>`
      );
      marker.addTo(msgThreatLayer);

      if (msgMarkers.has(key)) {
        const _old = msgMarkers.get(key);
        if (_old.marker) msgThreatLayer.removeLayer(_old.marker);
        detachTrail(_old);
      }
      const obsObj = {
        marker, lastSeen: c.lastSeen, firstSeen: c.firstSeen,
        alt: null, falling: false, hdg: arrowBearing,
        cls, place: { name: place.name, lat: place.lat, lon: place.lon },
        targetPlace: place,
        threat: { type: cls.type, status: "active", _speed: 0 },
        confirmN, totalWeight: totalW, channels: c.channels,
        heading: arrowBearing, speedKmh: 0,
        stage: null, stale: false, trail: null
      };
      msgMarkers.set(key, obsObj);
      attachTrail(obsObj, arrowBearing);
      continue;
    }

    if (c.kind === "region" || c.kind === "origin" || c.kind === "default" || c.kind === "guess") {
      const { region, cls, stage, origin, target } = c;
      const originLabel = origin.kind === "origin"
        ? `${origin.name} (${origin.region})`
        : origin.name;
      if (!inZone(region.lat, region.lon)) continue;
      let marker;

      if (stage === "launch") {
        const targetBearing = target
          ? bearingBetween(region.lat, region.lon, target.lat, target.lon)
          : bearingBetween(region.lat, region.lon, 50.45, 30.52);
        const fakeThreat = {
          type: cls.type,
          _altitude: parseAltitude({ explanationShort: c.sampleText }),
          _falling: false, _stage: "launch", heading: targetBearing
        };
        marker = L.marker([region.lat, region.lon], {
          icon: makeIcon(fakeThreat, targetBearing, true, confirmN, totalW, null, false),
          zIndexOffset: 950
        });
        const targetLine = target ? `<br>Цель (из текста): ${esc(target.name)}` : "";
        marker.bindPopup(
          `<div class="popup-title type-${cls.type}">🚀 ПУСК · ${cls.label}</div>
           <div>${esc(c.sampleText.slice(0,220))}</div>
           <div class="popup-meta">
             <b>${esc(originLabel)}</b><br>
             Курс: ${Math.round(targetBearing)}°${targetLine}
             <br>Подтверждений: <b>${confirmN}</b> канал(ов), вес <b>${totalW.toFixed(1)}</b>
           </div>
           ${channelsListHtml(c.channels)}
           <div class="popup-guess">⚠️ Позиція = ${origin.kind === "origin" ? "площадка" : "область"} із повідомлення.</div>`
        );
        marker.addTo(msgThreatLayer);
        if (msgMarkers.has(key)) {
          const _old = msgMarkers.get(key);
          if (_old.marker) msgThreatLayer.removeLayer(_old.marker);
          detachTrail(_old);
        }
        const speed = DEFAULT_SPEED[cls.type] || DEFAULT_SPEED.unknown;
        const launchObj = {
          marker, lastSeen: c.lastSeen, firstSeen: c.firstSeen,
          alt: null, falling: false, hdg: targetBearing,
          cls, place: { name: originLabel, lat: region.lat, lon: region.lon },
          targetPlace: target, eta: null,
          threat: { type: cls.type, status: "active", _speed: speed },
          confirmN, totalWeight: totalW, channels: c.channels,
          moveBase: { lat: region.lat, lon: region.lon, t: c.firstSeen },
          heading: targetBearing, speedKmh: speed, stage: "launch",
          stale: false, trail: null
        };
        msgMarkers.set(key, launchObj);
        attachTrail(launchObj, targetBearing);
      } else {
        marker = L.marker([region.lat, region.lon], {
          icon: launcherIcon(stage, originLabel, confirmN, totalW),
          zIndexOffset: 940
        });
        const ageLeft = isThreatSolo ? Math.max(0, CONFIG.LAUNCHER_SOLO_TTL_MS - age) : 0;
        const pendingLine = isThreatSolo
          ? `<br><span style="color:#0369a1">⏱ Ожидает 2-го канала · осталось ${Math.round(ageLeft/1000)}с</span>`
          : "";
        marker.bindPopup(
          `<div class="popup-title type-launcher">⚠ ЗАГРОЗА · ${cls.label}</div>
           <div>${esc(c.sampleText.slice(0,220))}</div>
           <div class="popup-meta">
             <b>${esc(originLabel)}</b><br>
             Пуск ще не підтверджено${pendingLine}
             <br>Подтверждений: <b>${confirmN}</b> канал(ов), вес <b>${totalW.toFixed(1)}</b>
           </div>
           ${channelsListHtml(c.channels)}
           <div class="popup-guess">⚠️ Позиція = ${origin.kind === "origin" ? "площадка" : "область"} із повідомлення.</div>`
        );
        marker.addTo(msgThreatLayer);
        if (msgMarkers.has(key)) {
          const _old = msgMarkers.get(key);
          if (_old.marker) msgThreatLayer.removeLayer(_old.marker);
          detachTrail(_old);
        }
        msgMarkers.set(key, {
          marker, lastSeen: c.lastSeen, firstSeen: c.firstSeen,
          alt: null, falling: false, hdg: null,
          cls, place: { name: originLabel, lat: region.lat, lon: region.lon },
          targetPlace: target,
          threat: { type: cls.type, status: "active" },
          isRegion: true, stage, confirmN, totalWeight: totalW, channels: c.channels,
          stale: false, trail: null
        });
      }
      continue;
    }

    if (c.kind === "place") {
      const { place, cls, target } = c;
      if (!inZone(place.lat, place.lon) && !(target && inZone(target.lat, target.lon))) continue;

      const alt = parseAltitude({ explanationShort: c.sampleText });
      const falling = isFallingMessage(c.sampleText);
      const parsedSpeed = parseSpeedFromText({ explanationShort: c.sampleText });

      let hdg = null;
      let displayPos = [place.lat, place.lon];
      let targetPlace = target;

      // v14.12: если есть глаголы движения/курса — это цель со сдвигом.
      // Если нет — тоже цель (для missile/banderol/jet_drone/uav), просто ставим маркер ближе.
      const hasDirectionWords = /курс|напрям|в\s+сторон|летит|летять|руха|движется|наближ|підліта|подлета|йде\s+на|прямує|в\s+бік|у\s+бік/i.test(c.sampleText);

      if (target) {
        const dist = haversineKm(place.lat, place.lon, target.lat, target.lon);
        if (dist < 5) {
          const src = DEFAULT_SOURCES[cls.type];
          if (src) {
            const srcBearing = bearingBetween(src.lat, src.lon, target.lat, target.lon);
            displayPos = destPoint(target.lat, target.lon, (srcBearing + 180) % 360, CONFIG.PRE_TARGET_OFFSET_KM);
            hdg = srcBearing;
          } else {
            hdg = bearingBetween(place.lat, place.lon, target.lat, target.lon);
          }
        } else {
          hdg = bearingBetween(place.lat, place.lon, target.lat, target.lon);
        }
      } else {
        const src = DEFAULT_SOURCES[cls.type];
        if (src) {
          const bearing = bearingBetween(src.lat, src.lon, place.lat, place.lon);
          const distSrcToTarget = haversineKm(src.lat, src.lon, place.lat, place.lon);
          const offsetFromTarget = Math.min(CONFIG.FALLBACK_TARGET_OFFSET_KM, Math.max(15, distSrcToTarget * 0.3));
          displayPos = destPoint(place.lat, place.lon, (bearing + 180) % 360, offsetFromTarget);
          hdg = bearing;
          targetPlace = place;
        }
      }

      if (hdg == null && needsTrail(cls.type)) {
        const { origin, dist } = nearestRussianOrigin(place.lat, place.lon);
        if (origin && dist >= CONFIG.TRAIL_MIN_ORIGIN_DIST_KM) {
          hdg = bearingBetween(origin.lat, origin.lon, place.lat, place.lon);
        }
      }

      const speed = parsedSpeed || DEFAULT_SPEED[cls.type] || DEFAULT_SPEED.unknown;
      let eta = null;
      if (targetPlace) {
        const distKm = haversineKm(displayPos[0], displayPos[1], targetPlace.lat, targetPlace.lon);
        eta = distKm / speed * 60;
      }

      const marker = L.marker(displayPos, {
        icon: guessIcon(cls, hdg, alt, falling, null, confirmN, totalW, eta, false),
        zIndexOffset: 900
      });
      const targetLine = targetPlace && targetPlace !== place
        ? `<br>🎯 Цель: <b>${esc(targetPlace.name)}</b>` : "";
      const etaLine = (eta != null && eta > 0)
        ? `<div class="popup-eta">⏱ Примерное время подлёта: ${formatEta(eta)}</div>` : "";
      const speedLine = parsedSpeed ? `<br>Скорость: <b>${parsedSpeed} км/ч</b>` : "";
      marker.bindPopup(
        `<div class="popup-title type-${cls.type}">${cls.label} ?</div>
         <div>${esc(c.sampleText.slice(0,220))}</div>
         ${etaLine}
         <div class="popup-meta">
           🎯 Ціль: <b>${esc(place.name)}</b>${targetLine}
           ${alt != null ? "<br>Висота: " + formatAlt(alt) : ""}${speedLine}
           ${falling ? '<br><span style="color:#dc2626;font-weight:700">↓ Падає / знижується</span>' : ""}
           <br>Подтверждений: <b>${confirmN}</b> канал(ов), вес <b>${totalW.toFixed(1)}</b>
         </div>
         ${channelsListHtml(c.channels)}
         <div class="popup-guess">🎯 Ціль = місце, куди прямує. Маркер ≈${CONFIG.PRE_TARGET_OFFSET_KM} км до цілі.</div>`
      );
      marker.addTo(msgThreatLayer);

      if (msgMarkers.has(key)) {
        const _old = msgMarkers.get(key);
        if (_old.marker) msgThreatLayer.removeLayer(_old.marker);
        detachTrail(_old);
      }
      const placeObj = {
        marker, lastSeen: c.lastSeen, firstSeen: c.firstSeen,
        alt, falling, hdg, cls, place,
        targetPlace, eta,
        threat: { type: cls.type, status: "active", _speed: speed, _falling: falling },
        confirmN, totalWeight: totalW, channels: c.channels,
        moveBase: { lat: displayPos[0], lon: displayPos[1], t: c.firstSeen },
        heading: hdg, speedKmh: speed,
        stage: null, stale: false, trail: null
      };
      msgMarkers.set(key, placeObj);
      attachTrail(placeObj, hdg);
    }
  }

  for (const [key, c] of impacts) {
    const confirmN = c.channels.size;
    const totalW = totalWeightOf(c.channels);
    if (confirmN < CONFIG.MIN_CHANNELS_CONFIRM) continue;
    if (totalW < 2.0) continue;
    const eventAt = c.eventAt || c.lastSeen;
    const age = now - eventAt;
    if (age > CONFIG.IMPACT_TTL_MS) {
      if (impactMarkers.has(key)) {
        impactLayer.removeLayer(impactMarkers.get(key).marker);
        impactMarkers.delete(key);
      }
      continue;
    }
    if (!inZone(c.target.lat, c.target.lon)) continue;
    seen.add(key);
    const t = c.target;
    const marker = L.marker([t.lat, t.lon], {
      icon: impactIcon(confirmN, eventAt, totalW),
      zIndexOffset: 880
    });
    marker.bindPopup(
      `<div class="popup-title type-impact">💥 Взрыв / прилёт / падение</div>
       <div>${esc(c.sampleText.slice(0,220))}</div>
       <div class="popup-meta">
         Місце: <b>${esc(t.name)}</b>
         <br>Когда: <b>${formatAge(age)}</b>
         <br>Подтверждений: <b>${confirmN}</b> канал(ов), вес <b>${totalW.toFixed(1)}</b>
       </div>
       ${channelsListHtml(c.channels)}
       <div class="popup-guess">⚠️ За повідомленнями, не офіційна точка. Событие пропадает через 5 минут.</div>`
    );
    marker.addTo(impactLayer);
    if (impactMarkers.has(key)) impactLayer.removeLayer(impactMarkers.get(key).marker);
    impactMarkers.set(key, { marker, lastSeen: eventAt, eventAt, confirmN, channels: c.channels });
  }

  for (const [key, o] of [...msgMarkers]) {
    if (now - o.lastSeen > CONFIG.STALE_MSG_MS) {
      if (o.marker) msgThreatLayer.removeLayer(o.marker);
      detachTrail(o);
      msgMarkers.delete(key);
    }
  }
  for (const [key, o] of [...impactMarkers]) {
    if (now - (o.eventAt || o.lastSeen) > CONFIG.IMPACT_TTL_MS) {
      impactLayer.removeLayer(o.marker);
      impactMarkers.delete(key);
    }
  }

  updateStratBanner();
  try { computeThreatMeter(); } catch (e) { console.warn("meter", e); }
}

setInterval(() => {
  const now = Date.now();
  for (const [key, o] of [...impactMarkers]) {
    const age = now - (o.eventAt || o.lastSeen);
    if (age > CONFIG.IMPACT_TTL_MS) {
      impactLayer.removeLayer(o.marker);
      impactMarkers.delete(key);
      continue;
    }
    const ll = o.marker.getLatLng();
    const w = o.channels ? totalWeightOf(o.channels) : 0;
    const markerNew = L.marker([ll.lat, ll.lng], {
      icon: impactIcon(o.confirmN || 0, o.eventAt, w),
      zIndexOffset: 880
    });
    if (o.marker.getPopup()) markerNew.bindPopup(o.marker.getPopup().getContent());
    impactLayer.removeLayer(o.marker);
    markerNew.addTo(impactLayer);
    o.marker = markerNew;
  }
}, 60000);

/* ============================================================
   FETCH + BACKOFF + CACHE
============================================================ */
let backoffMs = 0;
let abortCtrl = null;
let savedThreats = null, savedAlerts = null, savedMessages = null;
let lastFetchOkAt = 0;

function persistToStorage() {
  try {
    localStorage.setItem("kt_v14_12_cache", JSON.stringify({
      ts: Date.now(), threats: savedThreats, alerts: savedAlerts, messages: savedMessages
    }));
  } catch {}
}
function restoreFromStorage() {
  try {
    const raw = localStorage.getItem("kt_v14_12_cache");
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (Date.now() - data.ts > 30 * 60 * 1000) return false;
    savedThreats = data.threats; savedAlerts = data.alerts; savedMessages = data.messages;
    applyData(data.threats || [], data.alerts || {}, data.messages || []);
    return true;
  } catch { return false; }
}
function applyData(threats, alerts, messages) {
  syncThreats(threats);
  try { syncAlertPolygons(alerts); } catch (e) { console.warn(e); }
  try { syncMessageThreats(messages); } catch (e) { console.warn(e); }
  updateStats(threats, alerts);
}
async function fetchData() {
  if (abortCtrl) abortCtrl.abort();
  abortCtrl = new AbortController();
  const signal = abortCtrl.signal;
  try {
    const [tr, al, msg] = await Promise.all([
      fetch(CONFIG.API_THREATS, { signal }).then(r => { if (!r.ok) throw new Error("threats "+r.status); return r.json(); }),
      fetch(CONFIG.API_ALERTS, { signal }).then(r => { if (!r.ok) throw new Error("alerts "+r.status); return r.json(); }),
      fetch(CONFIG.API_MESSAGES, { signal }).then(r => r.json()).catch(() => ({ messages: [] }))
    ]);
    const threats = tr.threats || [];
    savedThreats = threats; savedAlerts = al; savedMessages = msg.messages || [];
    applyData(threats, al, msg.messages || []);
    lastFetchOkAt = Date.now();
    updateLiveBadge("ok");
    backoffMs = 0;
    persistToStorage();
    checkKyivProximity(threats);
  } catch (e) {
    if (e.name === "AbortError") return;
    console.error(e);
    updateLiveBadge("err");
    backoffMs = Math.min((backoffMs || CONFIG.POLL_MS) * 2, CONFIG.MAX_BACKOFF_MS);
  }
}

function updateLiveBadge(state) {
  const badge = $("liveBadge");
  if (!badge) return;
  if (state === "ok") {
    badge.textContent = "онлайн";
    badge.classList.add("live");
    badge.classList.remove("stale");
    badge.style.background = "";
    badge.style.color = "";
  } else if (state === "err") {
    badge.textContent = "ошибка";
    badge.classList.remove("live");
    badge.classList.add("stale");
  } else if (state === "kyiv") {
    badge.textContent = "⚠ ≤50 км";
    badge.style.background = "#7f1d1d";
    badge.style.color = "#fecaca";
  }
}

/* ============================================================
   ЗВУК + БЛИЗОСТЬ К КИЕВУ
============================================================ */
let lastKyivAlertAt = 0;
let audioCtx = null;
function playAlertBeep() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const now = audioCtx.currentTime;
    for (let i = 0; i < 3; i++) {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = "square"; o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, now + i*0.28);
      g.gain.exponentialRampToValueAtTime(0.25, now + i*0.28 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, now + i*0.28 + 0.2);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(now + i*0.28); o.stop(now + i*0.28 + 0.22);
    }
  } catch (e) { console.warn("audio", e); }
}
function checkKyivProximity(threats) {
  let nearest = Infinity;
  for (const raw of threats || []) {
    const t = normalizeThreat(raw);
    if (t.status === "resolved" || t.lat == null || t.lon == null) continue;
    const d = haversineKm(CONFIG.KYIV[0], CONFIG.KYIV[1], t.lat, t.lon);
    if (d < nearest) nearest = d;
  }
  for (const o of msgMarkers.values()) {
    if (!o.marker) continue;
    if (o.cls && (o.cls.isMig || o.cls.isStrategic)) continue;
    const ll = o.marker.getLatLng();
    const d = haversineKm(CONFIG.KYIV[0], CONFIG.KYIV[1], ll.lat, ll.lng);
    if (d < nearest) nearest = d;
  }
  if (nearest <= CONFIG.KYIV_ALERT_KM) {
    const now = Date.now();
    if (now - lastKyivAlertAt > 60000) {
      lastKyivAlertAt = now;
      playAlertBeep();
      updateLiveBadge("kyiv");
      setTimeout(() => updateLiveBadge("ok"), 15000);
    }
  }
}

/* ============================================================
   ПОЛЛИНГ
============================================================ */
let pollTimer = null;
async function pollLoop() {
  await fetchData();
  const delay = backoffMs > 0 ? backoffMs : CONFIG.POLL_MS;
  pollTimer = setTimeout(pollLoop, delay);
}
function startPolling() { if (pollTimer) clearTimeout(pollTimer); pollLoop(); }
function stopPolling() {
  if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; }
  if (abortCtrl) { abortCtrl.abort(); abortCtrl = null; }
}

/* ============================================================
   UI
============================================================ */
$("btnRefresh").addEventListener("click", () => { backoffMs = 0; startPolling(); });

document.addEventListener("click", () => {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
});
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { stopPolling(); stopAnim(); }
  else { startPolling(); startAnim(); }
});

/* ============================================================
   СТАРТ
============================================================ */
(async function init() {
  const ctrl = new AbortController();
  loadAlertGeo(ctrl.signal);
  const hadCache = restoreFromStorage();
  if (!hadCache) showToast("Загрузка…");
  startPolling();
  startAnim();
})();
</script>
